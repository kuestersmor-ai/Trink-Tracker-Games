<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Trinkrunde – Personen hinzufügen</title>
	<style>
		:root {
			--ink: #16313a;
			--muted: #61757a;
			--paper: #fffdf7;
			--aqua: #13a9a2;
			--aqua-dark: #087875;
			--coral: #ef765f;
			--line: #d8e5df;
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
			padding: 32px 20px;
			background: linear-gradient(135deg, #d9f2ed 0%, #f8e9d4 100%);
			color: var(--ink);
			font-family: Georgia, 'Times New Roman', serif;
		}

		main {
			width: min(100%, 680px);
			margin: 0 auto;
		}

		.eyebrow {
			margin: 0 0 10px;
			color: var(--aqua-dark);
			font-size: 0.8rem;
			font-weight: bold;
			letter-spacing: 0.14em;
			text-transform: uppercase;
		}

		h1 {
			max-width: 520px;
			margin: 0;
			font-size: clamp(2.5rem, 8vw, 5rem);
			line-height: 0.95;
		}

		.intro {
			max-width: 500px;
			margin: 20px 0 28px;
			color: var(--muted);
			font-size: 1.1rem;
			line-height: 1.5;
		}

		.panel {
			padding: clamp(22px, 5vw, 38px);
			background: var(--paper);
			border: 1px solid rgba(22, 49, 58, 0.08);
			border-radius: 8px;
			box-shadow: 0 18px 45px rgba(22, 49, 58, 0.12);
		}

		.input-row {
			display: flex;
			gap: 10px;
		}

		label {
			display: block;
			margin-bottom: 10px;
			font-size: 1.1rem;
			font-weight: bold;
		}

		input {
			min-width: 0;
			flex: 1;
			padding: 14px 16px;
			color: var(--ink);
			background: #fff;
			border: 2px solid var(--line);
			border-radius: 4px;
			font: inherit;
			font-size: 1rem;
		}

		input:focus {
			outline: 3px solid rgba(19, 169, 162, 0.22);
			border-color: var(--aqua);
		}

		button {
			border: 0;
			border-radius: 4px;
			cursor: pointer;
			font: inherit;
			font-weight: bold;
		}

		.add-button,
		.start-button {
			padding: 14px 20px;
			color: white;
			background: var(--aqua-dark);
		}

		button:hover:not(:disabled) {
			filter: brightness(1.08);
		}

		button:focus-visible {
			outline: 3px solid rgba(239, 118, 95, 0.45);
			outline-offset: 2px;
		}

		.list-heading {
			display: flex;
			align-items: baseline;
			justify-content: space-between;
			gap: 16px;
			margin-top: 32px;
		}

		h2 {
			margin: 0;
			font-size: 1.35rem;
		}

		.count {
			color: var(--muted);
			font-size: 0.95rem;
		}

		.person-list {
			display: grid;
			gap: 8px;
			margin: 14px 0 26px;
			padding: 0;
			list-style: none;
		}

		.person-item {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 16px;
			padding: 12px 14px;
			background: #eef8f4;
			border-left: 4px solid var(--aqua);
		}

		.remove-button {
			padding: 4px 8px;
			color: var(--coral);
			background: transparent;
			font-size: 0.9rem;
		}

		.empty-state {
			margin: 14px 0 26px;
			color: var(--muted);
			font-style: italic;
		}

		.start-button {
			width: 100%;
			background: var(--coral);
		}

		.start-button:disabled {
			cursor: not-allowed;
			opacity: 0.45;
		}

		.status {
			min-height: 1.5em;
			margin: 12px 0 0;
			color: var(--muted);
			font-size: 0.9rem;
			text-align: center;
		}

		@media (max-width: 520px) {
			body {
				padding: 24px 14px;
			}

			.input-row {
				flex-direction: column;
			}

			.add-button {
				width: 100%;
			}
		}
	</style>
</head>
<body>
	<main>
		<p class="eyebrow">Minispiel 01</p>
		<h1>Wer ist dabei?</h1>
		<p class="intro">Sammelt eure Runde, bevor das Spiel beginnt. Jede Person kann einzeln hinzugefügt oder wieder entfernt werden.</p>

		<section class="panel" aria-labelledby="players-heading">
			<form id="player-form">
				<label for="player-name">Person hinzufügen</label>
				<div class="input-row">
					<input id="player-name" name="player-name" type="text" maxlength="30" autocomplete="off" placeholder="Name eingeben" required>
					<button class="add-button" type="submit">Hinzufügen</button>
				</div>
			</form>

			<div class="list-heading">
				<h2 id="players-heading">Deine Liste</h2>
				<span class="count" id="player-count">0 Personen</span>
			</div>

			<p class="empty-state" id="empty-state">Noch niemand dabei.</p>
			<ul class="person-list" id="person-list" aria-live="polite"></ul>

			<button class="start-button" id="start-button" type="button" disabled>Spiel starten</button>
			<p class="status" id="status" role="status"></p>
		</section>
	</main>

	<script>
		const players = [];
		const playerForm = document.getElementById('player-form');
		const playerName = document.getElementById('player-name');
		const personList = document.getElementById('person-list');
		const emptyState = document.getElementById('empty-state');
		const playerCount = document.getElementById('player-count');
		const startButton = document.getElementById('start-button');
		const status = document.getElementById('status');

		function updatePlayerList() {
			personList.replaceChildren();
			emptyState.hidden = players.length > 0;
			playerCount.textContent = `${players.length} ${players.length === 1 ? 'Person' : 'Personen'}`;
			startButton.disabled = players.length < 2;

			players.forEach((name, index) => {
				const item = document.createElement('li');
				item.className = 'person-item';

				const nameLabel = document.createElement('span');
				nameLabel.textContent = name;

				const removeButton = document.createElement('button');
				removeButton.className = 'remove-button';
				removeButton.type = 'button';
				removeButton.textContent = 'Entfernen';
				removeButton.setAttribute('aria-label', `${name} entfernen`);
				removeButton.addEventListener('click', () => {
					players.splice(index, 1);
					updatePlayerList();
				});

				item.append(nameLabel, removeButton);
				personList.append(item);
			});
		}

		playerForm.addEventListener('submit', (event) => {
			event.preventDefault();
			const name = playerName.value.trim();

			if (!name) return;
			if (players.some((player) => player.toLowerCase() === name.toLowerCase())) {
				status.textContent = 'Diese Person ist bereits in der Liste.';
				playerName.select();
				return;
			}

			players.push(name);
			status.textContent = '';
			playerForm.reset();
			playerName.focus();
			updatePlayerList();
		});

		startButton.addEventListener('click', () => {
			status.textContent = `Die Runde ist bereit für ${players.join(', ')}.`;
		});

		updatePlayerList();
	</script>
</body>
</html>
